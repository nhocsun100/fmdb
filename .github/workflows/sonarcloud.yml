name: SonarCloud

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate SonarCloud configuration
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          missing=0

          if [ -z "$SONAR_TOKEN" ]; then
            echo "Missing secret: SONAR_TOKEN"
            missing=1
          fi
          if [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "Missing repository variable: SONAR_PROJECT_KEY"
            missing=1
          fi
          if [ -z "$SONAR_ORGANIZATION" ]; then
            echo "Missing repository variable: SONAR_ORGANIZATION"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "Configure these in GitHub: Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Skip SonarCloud on fork PRs without secrets
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true }}
        run: echo "Skipping SonarCloud scan for forked pull_request because SONAR_TOKEN is unavailable."

      - name: SonarCloud Scan
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        uses: SonarSource/sonarcloud-github-action@4006f663ecaf1f8093e8e4abb9227f6041f52216
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
